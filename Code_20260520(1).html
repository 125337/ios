<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>还原圆形单选按钮样式（带永久边框）</title>
    <style>
        /* 页面基础样式，模拟你截图中的背景 */
        body {
            margin: 0;
            padding: 40px;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 选项行容器，模拟设置项布局 */
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5ea;
        }

        /* 选项文字 */
        .setting-label {
            font-size: 17px;
            color: #1c1c1e;
        }

        /* 自定义圆形单选按钮容器 */
        .custom-radio {
            position: relative;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        /* 隐藏原生单选按钮 */
        .custom-radio input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* 自定义圆形外观：始终保留浅灰色边框 */
        .radio-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #ffffff;
            border: 1px solid #d1d1d6; /* 永久浅灰色边框 */
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* 选中状态：填充颜色，但边框保持不变 */
        .custom-radio input:checked ~ .radio-circle {
            background-color: #ff3b30; /* 截图中的红色 */
            /* 不修改 border-color，保持浅灰色边框 */
        }
    </style>
</head>
<body>
    <!-- 已选中的红色按钮 -->
    <div class="setting-item">
        <div class="setting-label">发送者文字颜色 (浅色)</div>
        <label class="custom-radio">
            <input type="radio" name="color-option" checked>
            <span class="radio-circle"></span>
        </label>
    </div>

    <!-- 未选中的按钮 -->
    <div class="setting-item">
        <div class="setting-label">发送者文字颜色 (深色)</div>
        <label class="custom-radio">
            <input type="radio" name="color-option">
            <span class="radio-circle"></span>
        </label>
    </div>

    <!-- 选中的蓝色按钮示例 -->
    <div class="setting-item">
        <div class="setting-label">接收者文字颜色 (浅色)</div>
        <label class="custom-radio">
            <input type="radio" name="color-option2" checked>
            <span class="radio-circle" style="--checked-color: #007aff;"></span>
        </label>
    </div>

    <style>
        /* 给其他颜色的按钮用的变量 */
        .custom-radio input:checked ~ .radio-circle[style*="--checked-color"] {
            background-color: var(--checked-color);
        }
    </style>
</body>
</html>
