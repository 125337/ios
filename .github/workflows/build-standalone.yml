name: Build Mio助手

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Build dylib (arm64)
      run: |
        set -o pipefail
        mkdir -p build build/CydiaSubstrate.framework

        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK_PATH: $SDK_PATH"

        echo "=== Step 0: Build CydiaSubstrate.framework ==="
        clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -install_name @rpath/CydiaSubstrate.framework/CydiaSubstrate \
              -o build/CydiaSubstrate.framework/CydiaSubstrate \
              WeChatPlugin/libs/CydiaSubstrate.m

        cp WeChatPlugin/libs/CydiaSubstrate.framework/Info.plist build/CydiaSubstrate.framework/
        cp WeChatPlugin/libs/CydiaSubstrate.framework/Headers/CydiaSubstrate.h build/CydiaSubstrate.framework/

        echo "=== Step 1: Compile each .m file to .o ==="
        OBJ_FILES=""
        for f in \
          WeChatPlugin/Tweak.m \
          WeChatPlugin/Config/PluginConfig.m \
          WeChatPlugin/Core/HookEngine.m \
          WeChatPlugin/Core/WPAlert.m \
          WeChatPlugin/Registry/HookRegistry.m \
          WeChatPlugin/Registry/FeatureModuleRegistry.m \
          WeChatPlugin/Registry/FeatureRegistry.m \
          WeChatPlugin/Modules/Revoke/RevokeHandler.m \
          WeChatPlugin/Modules/Revoke/RevokeHook.m \
          WeChatPlugin/Modules/RedEnvelop/RedEnvelopHook.m \
          WeChatPlugin/Modules/RedEnvelop/WeChatRedEnvelopParam.m \
          WeChatPlugin/Modules/RedEnvelop/WeChatRedEnvelopOperation.m \
          WeChatPlugin/Modules/RedEnvelop/WeChatRedEnvelopTaskManager.m \
          WeChatPlugin/Modules/Layout/TintHook.m \
          WeChatPlugin/Modules/Unread/ClearUnreadHook.m \
          WeChatPlugin/Modules/SettingEntry/SettingEntryHook.m \
          WeChatPlugin/Modules/SettingEntry/WPOtherVC.m \
          WeChatPlugin/Modules/SettingEntry/WPAboutVC.m \
          WeChatPlugin/Modules/Joker/JokerHook.m \
          WeChatPlugin/Modules/GroupExit/GroupExitHook.m \
          WeChatPlugin/Modules/MessageTime/MessageTimeHook.m \
          WeChatPlugin/Modules/AutoTransfer/AutoTransferHook.m \
          WeChatPlugin/Settings/Common/SettingCategoryController.m \
          WeChatPlugin/Settings/Common/WPBorderLayer.m \
          WeChatPlugin/Settings/Controllers/SettingController.m \
          WeChatPlugin/Settings/Controllers/SettingGeneralFunctionController.m \
          WeChatPlugin/Settings/Controllers/SettingLayoutFunctionController.m \
          WeChatPlugin/Settings/Controllers/SettingAssistFunctionController.m \
          WeChatPlugin/Settings/Controllers/SettingUIBeautifyController.m \
          WeChatPlugin/Settings/Controllers/SettingRedEnvelopController.m \
          WeChatPlugin/Settings/Controllers/SettingAboutController.m \
          WeChatPlugin/Settings/Controllers/WeChatTweakGroupSelectsController.m; do
          BASENAME=$(basename "$f" .m)
          OBJ_FILE="build/${BASENAME}.o"
          echo "Compiling: $f -> $OBJ_FILE"
          clang -arch arm64 \
                -isysroot "$SDK_PATH" \
                -target arm64-apple-ios14.0 \
                -c \
                -fobjc-arc \
                -Wno-deprecated-declarations \
                -Wno-unused-function \
                -IWeChatPlugin \
                -IWeChatPlugin/Config \
                -IWeChatPlugin/Core \
                -IWeChatPlugin/Registry \
                -IWeChatPlugin/Modules/Revoke \
                -IWeChatPlugin/Modules/RedEnvelop \
                -IWeChatPlugin/Modules/Layout \
                -IWeChatPlugin/Modules/Unread \
                -IWeChatPlugin/Modules/SettingEntry \
                -IWeChatPlugin/Modules/Joker \
                -IWeChatPlugin/Modules/GroupExit \
                -IWeChatPlugin/Modules/MessageTime \
                -IWeChatPlugin/Modules/AutoTransfer \
                -IWeChatPlugin/Settings/Common \
                -IWeChatPlugin/Settings/Controllers \
                -IWeChatPlugin/libs/CydiaSubstrate.framework/Headers \
                -o "$OBJ_FILE" \
                "$f"
          OBJ_FILES="$OBJ_FILES $OBJ_FILE"
        done
        
        echo "=== Step 2: Link all .o into dylib ==="
        clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -framework UIKit \
              -framework Foundation \
              -framework Security \
              -framework AVFoundation \
              -framework UserNotifications \
              -F build \
              -framework CydiaSubstrate \
              -Wl,-rpath,@loader_path \
              -Wl,-undefined,dynamic_lookup \
              -o build/Mio_arm64.dylib \
              $OBJ_FILES
        
        echo "=== Build successful ==="
        ls -la build/Mio_arm64.dylib
        ls -la build/CydiaSubstrate.framework/CydiaSubstrate
        
    - name: Sign dylib
      run: |
        codesign -f -s - build/Mio_arm64.dylib
        codesign -f -s - build/CydiaSubstrate.framework/CydiaSubstrate
        
    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'Mio.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: Mio.dylib
        path: |
          build/Mio_arm64.dylib
          build/CydiaSubstrate.framework/CydiaSubstrate
        retention-days: 30