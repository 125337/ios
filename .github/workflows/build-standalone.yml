name: Build Mio助手

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build dylib (arm64)
      run: |
        set -o pipefail

        rm -rf build/
        mkdir -p build

        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

        for f in \
          MioPlugin/Tweak.m \
          MioPlugin/Config/WPColorUtil.m \
          MioPlugin/Core/ConfigDescriptor.m \
          MioPlugin/Core/ConfigManager.m \
          MioPlugin/Core/WPUtility.m \
          MioPlugin/Modules/Revoke/RevokeConfig.m \
          MioPlugin/Modules/Unread/ClearUnreadConfig.m \
          MioPlugin/Modules/Joker/JokerConfig.m \
          MioPlugin/Modules/GroupExit/GroupExitConfig.m \
          MioPlugin/Modules/RedEnvelop/RedEnvelopConfig.m \
          MioPlugin/Modules/AutoTransfer/AutoTransferConfig.m \
          MioPlugin/Modules/ChatTopBar/ChatTopBarConfig.m \
          MioPlugin/Modules/MessageTime/MessageTimeConfig.m \
          MioPlugin/Modules/Layout/UIPurifyConfig.m \
          MioPlugin/Modules/Layout/AttachLayoutConfig.m \
          MioPlugin/Modules/HideAvatar/HideAvatarConfig.m \
          MioPlugin/Modules/PlaceholderText/PlaceholderTextConfig.m \
          MioPlugin/Modules/ListCornerRadius/ListCornerRadiusConfig.m \
          MioPlugin/Modules/ProfileCardBg/CardBgConfig.m \
          MioPlugin/Modules/FontLayout/FontLayoutConfig.m \
          MioPlugin/Config/WPHueSlider.m \
          MioPlugin/Config/WPHueSlider.m \
          MioPlugin/Config/WPSaturationBrightnessView.m \
          MioPlugin/Config/WPRGBAControl.m \
          MioPlugin/Config/WPHexInputView.m \
          MioPlugin/Config/WPColorPaletteView.m \
          MioPlugin/Config/WPHsvColorPickerController.m \
          MioPlugin/Config/WPColorPicker.m \
          MioPlugin/Core/MioAlertHelper.m \
          MioPlugin/Core/MioRestartHelper.m \
          MioPlugin/Core/LogManager.m \
          MioPlugin/Core/MioSubstrate.m \
          MioPlugin/Registry/MioModuleRegistry.m \
          MioPlugin/Modules/Revoke/RevokeHandler.m \
          MioPlugin/Modules/Revoke/RevokeHook.m \
          MioPlugin/Modules/Revoke/RevokeFormatEditorVC.m \
          MioPlugin/Modules/RedEnvelop/RedEnvelopHook.m \
          MioPlugin/Modules/RedEnvelop/MioRedEnvelopTaskManager.m \
          MioPlugin/Modules/Layout/UIPurifyHook.m \
          MioPlugin/Modules/Layout/UIAttachLayoutHook.m \
          MioPlugin/Modules/Unread/ClearUnreadHook.m \
          MioPlugin/Modules/SettingEntry/SettingEntryHook.m \
          MioPlugin/Modules/SettingEntry/WPCommonUI.m \
          MioPlugin/Modules/SettingEntry/WPOtherVC.m \
          MioPlugin/Modules/SettingEntry/WPAboutVC.m \
          MioPlugin/Modules/SettingEntry/WPBackupVC.m \
          MioPlugin/Modules/SettingEntry/WPUIVC.m \
          MioPlugin/Modules/SettingEntry/WPUIPurifyVC.m \
          MioPlugin/Modules/SettingEntry/WPUIAttachmentLayoutVC.m \
          MioPlugin/Modules/SettingEntry/WPUIPlaceholderTextVC.m \
          MioPlugin/Modules/Joker/JokerHook.m \
          MioPlugin/Modules/GroupExit/GroupExitHook.m \
          MioPlugin/Modules/MessageTime/MessageTimeHook.m \
          MioPlugin/Modules/MessageTime/MessageTimeFormatParser.m \
          MioPlugin/Modules/MessageTime/MessageTimeFormatEditorVC.m \
          MioPlugin/Modules/HideAvatar/HideAvatarHook.m \
          MioPlugin/Modules/AutoTransfer/AutoTransferHook.m \
          MioPlugin/Modules/PlaceholderText/PlaceholderTextHook.m \
          MioPlugin/Modules/ChatTopBar/MioChatAvatarTitleView.m \
          MioPlugin/Modules/ChatTopBar/ChatTopBarHook.m \
          MioPlugin/Modules/ChatTopBar/CSContactInfoPopoverController.m \
          MioPlugin/Modules/ChatTopBar/AvatarLoader.m \
          MioPlugin/Modules/ListCornerRadius/ListCornerRadiusHook.m \
          MioPlugin/Modules/ProfileCardBg/ProfileCardBgHook.m \
          MioPlugin/Modules/FontLayout/FontLayoutHook.m \
          MioPlugin/Core/Utils/CornerResponsibility/CornerResponsibility.m \
          MioPlugin/Settings/Common/SettingCategoryController.m \
          MioPlugin/Settings/Common/WPBorderLayer.m \
          MioPlugin/Settings/Controllers/SettingController.m \
          MioPlugin/Settings/Controllers/SettingAboutController.m \
          MioPlugin/Settings/Controllers/SettingGeneralFunctionController.m \
          MioPlugin/Settings/Controllers/SettingLayoutFunctionController.m \
          MioPlugin/Settings/Controllers/SettingMessageTimeController.m \
          MioPlugin/Settings/Controllers/SettingRevokeController.m \
          MioPlugin/Settings/Controllers/SettingRedEnvelopController.m \
          MioPlugin/Settings/Controllers/SettingAvatarHideController.m \
          MioPlugin/Settings/Controllers/SettingChatTopBarController.m \
          MioPlugin/Settings/Controllers/ChatTopBarBlacklistEditorVC.m \
          MioPlugin/Settings/Controllers/SettingListCornerRadiusController.m \
          MioPlugin/Settings/Controllers/SettingCardBackgroundController.m \
          MioPlugin/Settings/Controllers/SettingCornerRadiusController.m \
          MioPlugin/Settings/Controllers/WPUILayoutSettingsVC.m \
          MioPlugin/Settings/Controllers/MioTweakGroupSelectsController.m; do
          BASENAME=$(basename "$f" .m)
          OBJ_FILE="build/${BASENAME}.o"
          echo "Compiling: $f -> $OBJ_FILE"
          clang -arch arm64 \
                -isysroot "$SDK_PATH" \
                -target arm64-apple-ios14.0 \
                -c \
                -fobjc-arc \
                -Oz \
                -Wno-deprecated-declarations \
                -Wno-unused-function \
                -Wno-unused-variable \
                -IMioPlugin \
                -IMioPlugin/libs \
                -IMioPlugin/Config \
                -IMioPlugin/Core \
                -IMioPlugin/Registry \
                -IMioPlugin/Modules/Revoke \
                -IMioPlugin/Modules/RedEnvelop \
                -IMioPlugin/Modules/Layout \
                -IMioPlugin/Modules/Unread \
                -IMioPlugin/Modules/SettingEntry \
                -IMioPlugin/Modules/Joker \
                -IMioPlugin/Modules/GroupExit \
                -IMioPlugin/Modules/MessageTime \
                -IMioPlugin/Modules/AutoTransfer \
                -IMioPlugin/Modules/HideAvatar \
                -IMioPlugin/Modules/PlaceholderText \
                -IMioPlugin/Modules/ChatTopBar \
                -IMioPlugin/Modules/ListCornerRadius \
                -IMioPlugin/Modules/ProfileCardBg \
                -IMioPlugin/Modules/CornerResponsibility \
                -IMioPlugin/Modules/FontLayout \
                -IMioPlugin/Settings/Common \
                -IMioPlugin/Settings/Controllers \
                -o "$OBJ_FILE" \
                "$f" || { echo "FAILED: $f"; exit 1; }
        done

        echo "=== Link all .o into dylib ==="
        clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -framework UIKit \
              -framework Foundation \
              -framework Security \
              -framework AVFoundation \
              -framework UserNotifications \
              -framework CoreGraphics \
              -framework QuartzCore \
              -framework ImageIO \
              -framework PhotosUI \
              -framework MobileCoreServices \
              -Wl,-S \
              -Wl,-x \
              -o build/Mio_arm64.dylib \
              build/*.o

        echo "=== Build successful ==="
        ls -la build/Mio_arm64.dylib

    - name: Sign dylib
      run: |
        codesign -f -s - build/Mio_arm64.dylib

    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'Mio.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: Mio.dylib
        path: |
          build/Mio_arm64.dylib
        retention-days: 30