name: Build Mio助手

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install Theos
      run: |
        # 安装依赖
        brew install ldid xz

        # 安装 theos（如果不存在）
        THEOS_PATH="$HOME/theos"
        if [ ! -d "$THEOS_PATH" ]; then
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS_PATH"
        fi
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        # 下载 iOS SDK（如果不存在）
        SDK_DIR="$HOME/sdks"
        mkdir -p "$SDK_DIR"
        if [ ! -d "$SDK_DIR/iphoneos14.0.sdk" ]; then
          curl -L "https://github.com/sbingner/llvm-project/releases/download/swift-5.5-RELEASE/ios-sdk-14.0-darwin.tar.gz" -o /tmp/ios-sdk.tar.gz
          tar -xzf /tmp/ios-sdk.tar.gz -C "$SDK_DIR"
          mv "$SDK_DIR/iphoneos" "$SDK_DIR/iphoneos14.0.sdk"
          rm /tmp/ios-sdk.tar.gz
        fi
        echo "THEOS_SDKS_PATH=$SDK_DIR" >> $GITHUB_ENV

    - name: Build dylib (arm64)
      run: |
        cd WeChatPlugin
        make clean
        make package

    - name: Extract dylib from deb
      run: |
        # deb 包路径
        DEB_FILE=$(find WeChatPlugin/.theos/obj -name "*.deb" 2>/dev/null | head -1)
        if [ -z "$DEB_FILE" ]; then
          echo "ERROR: No .deb found"
          exit 1
        fi
        echo "Found deb: $DEB_FILE"

        # 解压 deb，提取 dylib
        mkdir -p build
        dpkg-deb -x "$DEB_FILE" build/deb_root
        find build/deb_root -name "*.dylib" -exec cp {} build/Mio_arm64.dylib \;
        echo "=== dylib extracted ==="
        ls -la build/Mio_arm64.dylib

    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'Mio.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: Mio.dylib
        path: |
          build/Mio_arm64.dylib
        retention-days: 30
