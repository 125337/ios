name: Build Mio助手

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build dylib (arm64)
      run: |
        set -o pipefail

        rm -rf build/
        mkdir -p build

        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

        # 自动发现 MioPlugin 下所有 .m 源文件（新增文件无需修改本 workflow）
        # 注意：macOS 自带 bash 3.2 无 mapfile，用 while read 兼容写法
        find MioPlugin -name '*.m' -type f | sort | while read -r f; do
          BASENAME=$(basename "$f" .m)
          OBJ_FILE="build/${BASENAME}.o"
          echo "Compiling: $f -> $OBJ_FILE"
          clang -arch arm64 \
                -isysroot "$SDK_PATH" \
                -target arm64-apple-ios14.0 \
                -c \
                -fobjc-arc \
                -Oz \
                -Wno-deprecated-declarations \
                -Wno-unused-function \
                -Wno-unused-variable \
                -IMioPlugin \
                -IMioPlugin/libs \
                -IMioPlugin/Config \
                -IMioPlugin/Core \
                -IMioPlugin/Registry \
                -IMioPlugin/Modules/Revoke \
                -IMioPlugin/Modules/RedEnvelop \
                -IMioPlugin/Modules/Layout \
                -IMioPlugin/Modules/Unread \
                -IMioPlugin/Modules/SettingEntry \
                -IMioPlugin/Modules/Joker \
                -IMioPlugin/Modules/GroupExit \
                -IMioPlugin/Modules/MessageTime \
                -IMioPlugin/Modules/AutoTransfer \
                -IMioPlugin/Modules/HideAvatar \
                -IMioPlugin/Modules/PlaceholderText \
                -IMioPlugin/Modules/ChatTopBar \
                -IMioPlugin/Modules/ListCornerRadius \
                -IMioPlugin/Modules/ProfileCardBg \
                -IMioPlugin/Modules/Voice \
                -IMioPlugin/Modules/CornerResponsibility \
                -IMioPlugin/Modules/FontLayout \
                -IMioPlugin/Settings/Common \
                -IMioPlugin/Settings/Controllers \
                -o "$OBJ_FILE" \
                "$f" || { echo "FAILED: $f"; exit 1; }
        done

        echo "=== Link all .o into dylib ==="
        clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -target arm64-apple-ios14.0 \
              -dynamiclib \
              -framework UIKit \
              -framework Foundation \
              -framework Security \
              -framework AVFoundation \
              -framework CoreMedia \
              -framework UserNotifications \
              -framework CoreGraphics \
              -framework QuartzCore \
              -framework ImageIO \
              -framework PhotosUI \
              -framework MobileCoreServices \
              -Wl,-S \
              -Wl,-x \
              -o build/Mio_arm64.dylib \
              build/*.o

        echo "=== Build successful ==="
        ls -la build/Mio_arm64.dylib

    - name: Sign dylib
      run: |
        codesign -f -s - build/Mio_arm64.dylib

    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'Mio.dylib') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted old artifact: ${artifact.name} (id: ${artifact.id})`);
            }
          }

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: Mio.dylib
        path: |
          build/Mio_arm64.dylib
        retention-days: 30
