name: Build Mio Plugin (Theos)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install Theos
      run: |
        brew install ldid
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Build dylib
      working-directory: MioPlugin
      run: |
        make clean
        make THEOS=$HOME/theos
        
    - name: Upload MioPlugin.dylib
      uses: actions/upload-artifact@v4
      with:
        name: MioPlugin_Theos.dylib
        path: MioPlugin/.theos/obj/debug/MioHelper.dylib
        retention-days: 30